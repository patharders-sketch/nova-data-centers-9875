<style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif}#map{position:absolute;inset:0}
.panel{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;padding:10px;border-radius:8px;box-shadow:0 1px 6px #0006;width:290px;max-height:calc(100% - 30px);overflow:auto;font-size:13px}
.panel h1{font-size:14px;margin:0 0 6px}.panel input[type=search]{width:100%;box-sizing:border-box;padding:6px;font-size:16px;margin:4px 0}
.panel label{display:flex;align-items:center;gap:6px;margin:3px 0;cursor:pointer}.panel h2{font-size:12px;margin:8px 0 2px;color:#444;text-transform:uppercase}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid #333;display:inline-block;flex:none}
.ol{width:12px;height:12px;display:inline-block;flex:none;background:#fff}
.num{color:#fff;font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;box-shadow:0 0 0 1.5px #fff,0 0 4px #000a;text-shadow:0 0 2px #000}
.num.y{color:#222;text-shadow:none}
#tg{display:none;float:right;border:0;background:none;font-size:18px}
@media(max-width:600px){.panel{left:50px;right:8px;width:auto;top:8px}.panel.c .body{display:none}#tg{display:block}}
.leaflet-popup-content{font-size:13px;line-height:1.4}.note{background:#fff3cd;padding:3px 5px;border-radius:4px;margin:4px 0}</style></head><body><div id="map"></div>
<div class="panel c" id="p"><button id="tg" onclick="p.classList.toggle('c')" aria-label="toggle panel">&#9776;</button><h1>NoVA data centers (<span id="cn"></span> items)</h1><div class="body">
<input type="search" id="q" placeholder="Search # / name / address / PIN / case / county">
<h2>County (outline color)</h2><div id="cf"></div>
<h2>Type (shape)</h2><div id="kf"></div>
<h2>Status (fill color)</h2><div id="leg"></div>
<div style="color:#555;margin-top:6px">Round = building. Square = application/project. Outline color = county. Status marked "inferred" is our reading of county data, not a county label.</div>
<div id="res" style="color:#333;margin-top:4px;font-weight:600"></div></div></div>

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=x=>Number(x).toLocaleString();
const onS=Object.fromEntries(Object.keys(SC).map(k=>[k,true])),onC=Object.fromEntries(Object.keys(CC).map(k=>[k,true])),onK={Building:true,Application:true};
const mk=DATA.map(d=>{const sq=d.kind!='Building',sz=30,oc=CC[d.county];
 const m=L.marker([d.lat,d.lon],{icon:L.divIcon({className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],html:`<div class="num${d.status=='Approved/Planned'?' y':''}" style="width:${sz}px;height:${sz}px;border-radius:${sq?'6px':'50%'};background:${SC[d.status]};border:3px solid ${oc};font-size:${d.n>99?10:11}px">${d.n}</div>`})});
 let h=`<b>#${d.n} ${esc(d.name)}</b><br><b style="color:${oc}">${esc(d.county)} County</b> &middot; ${d.kind=='Building'?'Data center building':d.kind=='Project'?'Project (no mapped buildings)':'Application/project'}<br>Status: <b style="color:${d.status=='Approved/Planned'?'#b8960b':SC[d.status]}">${esc(d.status)}</b>${d.src_status&&d.src_status!=d.status?` <small>(source: ${esc(d.src_status)})</small>`:''}`;
 if(d.project)h+=`<br>${d.kind=='Application'?'Type':'Campus/Project'}: ${esc(d.project)}`;
 if(d.cases)h+=`<br>Case(s): ${esc(d.cases)}`;else if(d.case)h+=`<br>Case: ${esc(d.case)}`;
 if(d.applied)h+=`<br>First applied: ${esc(d.applied)}`;
 if(d.address&&d.address!=d.name)h+=`<br>Address: ${esc(d.address)}`;
 if(d.pin)h+=`<br>${d.county=='Loudoun'?'PIN':'GPIN'}: ${esc(d.pin)}`;
 if(d.gfa)h+=`<br>GFA: ${num(d.gfa)} sf`;else if(d.kind=='Building')h+=`<br>GFA: not published`;
 if(d.year)h+=`<br>Year built: ${esc(d.year)}`;
 if(d.extra)h+=`<br>${esc(d.extra)}`;
 if(d.desc)h+=`<br>${esc(d.desc)}`;
 if(d.bn&&d.bn.length)h+=`<br>Buildings on site: ${d.bn.map(x=>'#'+x).join(', ')}`;
 if(d.note)h+=`<div class="note">${esc(d.note)}</div>`;
 h+=`<br><small><b>Basis (${esc(d.basis_type)}):</b> ${esc(d.basis)}</small><br><a href="${esc(d.src)}" target="_blank" rel="noopener">Source record</a>`;
 m.bindPopup(h,{maxWidth:340});m.d=d;
 m.layers=[m];if(d.poly){const pg=L.polygon(d.poly,{color:oc,weight:2,dashArray:'5 4',fillColor:SC[d.status],fillOpacity:.15});pg.bindPopup(h,{maxWidth:340});m.layers.push(pg)}
 m.hay=[d.n,d.name,d.address,d.pin,d.case,d.cases,d.project,d.county,d.status,d.src_status,d.kind].join(' ').toLowerCase();return m;});
const grp=L.layerGroup().addTo(map);
const cnt={},cc={},kc={};DATA.forEach(d=>{cnt[d.status]=(cnt[d.status]||0)+1;cc[d.county]=(cc[d.county]||0)+1;const k=d.kind=='Building'?'Building':'Application';kc[k]=(kc[k]||0)+1});
document.getElementById('leg').innerHTML=Object.keys(SC).map(k=>`<label><input type="checkbox" checked data-s="${esc(k)}"><span class="sw" style="background:${SC[k]}"></span>${esc(k)} (${cnt[k]||0})</label>`).join('');
document.getElementById('cf').innerHTML=Object.keys(CC).map(k=>`<label><input type="checkbox" checked data-c="${esc(k)}"><span class="ol" style="border:3px solid ${CC[k]};border-radius:50%"></span>${esc(k)} (${cc[k]||0})</label>`).join('');
document.getElementById('kf').innerHTML=`<label><input type="checkbox" checked data-k="Building"><span class="ol" style="border:2px solid #333;border-radius:50%"></span>Buildings (${kc.Building})</label><label><input type="checkbox" checked data-k="Application"><span class="ol" style="border:2px solid #333;border-radius:3px"></span>Applications / projects (${kc.Application})</label>`;
let lastQ='';
function upd(){const q=document.getElementById('q').value.trim().toLowerCase();grp.clearLayers();let v=[];
 mk.forEach(m=>{const d=m.d,k=d.kind=='Building'?'Building':'Application';if(onS[d.status]&&onC[d.county]&&onK[k]&&(!q||m.hay.includes(q))){m.layers.forEach(l=>grp.addLayer(l));v.push(m)}});
 document.getElementById('res').textContent=v.length+' shown';
 if(q&&q!=lastQ&&v.length)map.fitBounds(L.latLngBounds(v.map(m=>m.getLatLng())).pad(.2),{maxZoom:16});
 lastQ=q;if(q&&v.length==1)v[0].openPopup();}
const P=document.getElementById('p');
P.addEventListener('change',e=>{const t=e.target.dataset;if(t.s)onS[t.s]=e.target.checked;if(t.c)onC[t.c]=e.target.checked;if(t.k)onK[t.k]=e.target.checked;upd()});
document.getElementById('q').addEventListener('input',upd);
document.getElementById('cn').textContent=DATA.length;
map.fitBounds(L.latLngBounds(DATA.map(d=>[d.lat,d.lon])).pad(.05));
if(innerWidth<600)P.classList.add('c');else P.classList.remove('c');
upd();
addEventListener('message',e=>{const n=e.data&&e.data.goto;if(!n)return;const k=mk.find(m=>m.d.n==n);if(!k)return;
 onS[k.d.status]=onC[k.d.county]=onK[k.d.kind=='Building'?'Building':'Application']=true;P.querySelectorAll('input[type=checkbox]').forEach(i=>i.checked=true);document.getElementById('q').value='';upd();
 map.setView(k.getLatLng(),17);k.openPopup();});
</script></body></html>
